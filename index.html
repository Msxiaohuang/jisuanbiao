<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>中秋专属活动 </title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            /* 喜庆中秋 · 深空渐变 */
            background: radial-gradient(ellipse at 20% 30%, #2d1a1a 0%, #0f0c1a 70%, #050308 100%);
            position: relative;
            overflow-x: hidden;
        }

        /* ===== 月亮 ===== */
        .moon {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, #fff7e6, #f5c542);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(245, 197, 66, 0.5), 0 0 80px rgba(245, 197, 66, 0.25), 0 0 150px rgba(245, 197, 66, 0.1);
            z-index: 0;
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-16px);
            }
        }

        /* ===== 星星 ===== */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }
        @keyframes twinkle {
            0% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ===== 灯笼（装饰） ===== */
        .lantern-left,
        .lantern-right {
            position: absolute;
            font-size: 48px;
            z-index: 0;
            animation: swing 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 50, 0, 0.3));
        }
        .lantern-left {
            bottom: 20px;
            left: 20px;
            animation-delay: 0.5s;
        }
        .lantern-right {
            bottom: 40px;
            right: 20px;
            animation-delay: 1.2s;
            font-size: 36px;
        }
        @keyframes swing {
            0%,
            100% {
                transform: rotate(-8deg);
            }
            50% {
                transform: rotate(8deg);
            }
        }

        /* ===== 主卡片 ===== */
        .box {
            position: relative;
            z-index: 10;
            background: rgba(20, 12, 12, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 32px 28px 28px;
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(255, 215, 0, 0.25);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 215, 0, 0.05) inset;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        .box:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 0, 0.1) inset;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 28px;
            position: relative;
        }
        .header-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(145deg, #f5c542, #d48b1c);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 8px 24px rgba(245, 197, 66, 0.3);
            flex-shrink: 0;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fde68a, #f5c542, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(245, 197, 66, 0.15);
        }

        /* ===== 表单项 ===== */
        .item {
            margin-bottom: 22px;
        }
        .item:last-of-type {
            margin-bottom: 0;
        }
        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        label {
            font-size: 14px;
            font-weight: 600;
            color: #f0e6d2;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        label .unit {
            font-weight: 400;
            color: #c0a88a;
            font-size: 12px;
            margin-left: 4px;
        }
        .badge {
            font-size: 10px;
            font-weight: 600;
            color: #f5c542;
            background: rgba(245, 197, 66, 0.15);
            padding: 3px 12px;
            border-radius: 20px;
            border: 1px solid rgba(245, 197, 66, 0.15);
            letter-spacing: 0.5px;
        }

        /* ===== 输入框 ===== */
        .input-wrap {
            position: relative;
        }
        input {
            width: 100%;
            height: 56px;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 0 18px;
            font-size: 17px;
            font-weight: 500;
            color: #f5ede4;
            background: rgba(255, 255, 255, 0.06);
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s, transform 0.2s;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            font-variant-numeric: tabular-nums;
            backdrop-filter: blur(4px);
        }
        input:focus {
            border-color: #f5c542;
            background: rgba(255, 255, 255, 0.10);
            box-shadow: 0 0 0 4px rgba(245, 197, 66, 0.12), 0 0 30px rgba(245, 197, 66, 0.05);
            transform: scale(1.01);
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-weight: 400;
            font-size: 15px;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* ===== 结果区域 ===== */
        .result {
            margin-top: 28px;
            padding: 20px 20px 24px;
            background: radial-gradient(ellipse at 50% 0%, rgba(245, 197, 66, 0.08), rgba(20, 12, 12, 0.4));
            border-radius: 20px;
            border: 1px solid rgba(245, 197, 66, 0.12);
            position: relative;
            overflow: hidden;
            transition: border-color 0.4s, background 0.4s;
        }
        .result::before {
            content: '🥮';
            position: absolute;
            bottom: -10px;
            right: 10px;
            font-size: 60px;
            opacity: 0.06;
            transform: rotate(-10deg);
            pointer-events: none;
        }
        .result-tip {
            font-size: 12px;
            color: #c0a88a;
            text-align: center;
            letter-spacing: 4px;
            font-weight: 500;
            margin-bottom: 4px;
            position: relative;
            z-index: 1;
        }
        .result-divider {
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(245, 197, 66, 0.3), transparent);
            margin: 6px auto 14px;
            border-radius: 2px;
        }
        .total {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 10px;
            position: relative;
            z-index: 1;
        }
        .total .label {
            font-size: 16px;
            font-weight: 500;
            color: #d4c5b0;
            letter-spacing: 1px;
        }
        .total .number {
            font-size: 44px;
            font-weight: 800;
            color: #f5c542;
            letter-spacing: 2px;
            min-width: 80px;
            text-align: center;
            line-height: 1.1;
            transition: color 0.3s, text-shadow 0.3s;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 30px rgba(245, 197, 66, 0.2);
        }
        .total .number.zero {
            color: #665544;
            text-shadow: none;
        }
        .total .number.bump {
            animation: bump 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes bump {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(1.15);
                text-shadow: 0 0 60px rgba(245, 197, 66, 0.4);
            }
            100% {
                transform: scale(1);
            }
        }

        /* ===== 底部 ===== */
        .footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            font-size: 11px;
            color: #665544;
            letter-spacing: 0.5px;
        }
        .footer .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #443322;
        }
        .footer .lock {
            opacity: 0.4;
            font-size: 10px;
        }

        /* ===== 响应式微调 ===== */
        @media (max-width: 480px) {
            .moon {
                width: 80px;
                height: 80px;
                top: 20px;
                right: 20px;
            }
            .lantern-left,
            .lantern-right {
                font-size: 32px;
            }
            .box {
                padding: 24px 18px 22px;
                border-radius: 28px;
            }
            h1 {
                font-size: 19px;
            }
            .header-icon {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            .total .number {
                font-size: 34px;
                min-width: 60px;
            }
            input {
                height: 50px;
                font-size: 16px;
                padding: 0 14px;
            }
            .result {
                padding: 16px 14px 18px;
            }
        }
        @media (max-width: 380px) {
            .total .number {
                font-size: 28px;
                min-width: 48px;
            }
            .total .label {
                font-size: 14px;
            }
            .lantern-left,
            .lantern-right {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 装饰元素 ===== -->
    <div class="moon"></div>
    <div class="lantern-left">🏮</div>
    <div class="lantern-right">🏮</div>

    <!-- ===== 星星（JS 生成） ===== -->
    <div class="stars" id="starsContainer"></div>

    <!-- ===== 主卡片 ===== -->
    <div class="box">
        <div class="header">
            <div class="header-icon">🌕</div>
            <h1>中秋专属活动</h1>
        </div>

        <div class="item">
            <div class="label-row">
                <label>客户星级 <span class="unit">（0 ~ 5）</span></label>
                <span class="badge">必填</span>
            </div>
            <div class="input-wrap">
                <input id="star" type="number" placeholder="输入 0 ~ 5" inputmode="decimal" min="0" max="5" step="1" oninput="calc()" />
            </div>
        </div>

        <div class="item">
            <div class="label-row">
                <label>金融积分</label>
                <span class="badge">≥ 30000 生效</span>
            </div>
            <div class="input-wrap">
                <input id="score" type="number" placeholder="输入积分值" inputmode="decimal" min="0" step="1" oninput="calc()" />
            </div>
        </div>

        <div class="result" id="resultCard">
            <div class="result-tip">✦ 系统核算 ✦</div>
            <div class="result-divider"></div>
            <div class="total">
                <span class="label">专属好礼</span>
                <span class="number zero" id="total">0</span>
            </div>
        </div>

        <div class="footer">
            <span class="lock">🔒</span>
            <span>数据仅本地计算 · 不上传</span>
            <span class="dot"></span>
            <span>中秋限定</span>
        </div>
    </div>

    <script>
        // ===== 生成星星 =====
        (function createStars() {
            const container = document.getElementById('starsContainer');
            const count = 80;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                star.style.opacity = Math.random() * 0.5 + 0.3;
                container.appendChild(star);
            }
        })();

        // ===== 核心计算逻辑 =====
        function calc() {
            const starInput = document.getElementById('star');
            const scoreInput = document.getElementById('score');
            const totalEl = document.getElementById('total');
            const resultCard = document.getElementById('resultCard');

            let starVal = Number(starInput.value);
            let scoreVal = Number(scoreInput.value);

            if (isNaN(starVal) || starInput.value.trim() === '') starVal = 0;
            if (isNaN(scoreVal) || scoreInput.value.trim() === '') scoreVal = 0;

            if (starVal < 0) starVal = 0;
            if (starVal > 5) starVal = 5;

            // C2 星级HB
            let c2;
            if (starVal >= 5) c2 = 126;
            else if (starVal >= 4) c2 = 106;
            else if (starVal >= 3) c2 = 86;
            else if (starVal >= 2) c2 = 66;
            else if (starVal >= 1) c2 = 36;
            else c2 = 16;

            // C3 积分HB
            let c3 = 0;
            if (scoreVal >= 30000) {
                const temp = scoreVal * 0.0008;
                c3 = Math.round(temp / 10) * 10;
            }

            // 合计
            let total = 0;
            if (scoreVal >= 30000) {
                const sum = c2 + c3;
                total = sum >= 296 ? 296 : sum;
            }

            // 更新 UI
            const oldText = totalEl.innerText;
            totalEl.innerText = total;
            totalEl.className = 'number' + (total === 0 ? ' zero' : '');

            if (oldText !== String(total)) {
                totalEl.classList.remove('bump');
                void totalEl.offsetWidth;
                totalEl.classList.add('bump');
            }

            if (total > 0) {
                resultCard.style.borderColor = 'rgba(245, 197, 66, 0.3)';
                resultCard.style.background = 'radial-gradient(ellipse at 50% 0%, rgba(245, 197, 66, 0.12), rgba(20, 12, 12, 0.4))';
            } else {
                resultCard.style.borderColor = 'rgba(245, 197, 66, 0.08)';
                resultCard.style.background = 'radial-gradient(ellipse at 50% 0%, rgba(245, 197, 66, 0.04), rgba(20, 12, 12, 0.4))';
            }
        }

        document.addEventListener('DOMContentLoaded', calc);

        document.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    calc();
                    inp.blur();
                }
            });
        });

        document.getElementById('star').addEventListener('change', function() {
            let v = Number(this.value);
            if (!isNaN(v)) {
                if (v < 0) this.value = 0;
                if (v > 5) this.value = 5;
            }
            calc();
        });
    </script>
</body>
</html>
